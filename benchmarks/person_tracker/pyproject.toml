[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinker-ptbench"
version = "0.1.0"
description = "Person-tracker benchmark harness for vision_track"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["ptbench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
