<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>object_scan · tuning</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2b333d;
    --ink:#e6edf3; --dim:#8b98a5; --accent:#4493f8; --ok:#2ea043; --ok-bg:#132a18;
    --warn:#d29922; --err:#f85149; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px}
  header .keys{margin-left:auto;font:12px/1 var(--mono);color:var(--dim)}
  .pill{padding:2px 7px;border-radius:20px;border:1px solid var(--line)}
  .pill.on{color:var(--ok);border-color:var(--ok)}
  .pill.off{color:var(--err);border-color:var(--err)}
  main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;
    padding:16px 20px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;
    letter-spacing:.8px;color:var(--dim);font-weight:600}
  button{font:inherit;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08121f;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  video,#preview{width:100%;border-radius:8px;background:#000;display:block}
  #dz{margin-top:10px;border:1.5px dashed var(--line);border-radius:8px;
    padding:14px;text-align:center;color:var(--dim);font-size:13px}
  #dz.hot{border-color:var(--accent);color:var(--ink)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
    gap:8px;margin-top:12px;max-height:220px;overflow:auto}
  .thumb{position:relative;border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer}
  .thumb img{width:100%;height:64px;object-fit:cover;display:block}
  .thumb.sel{border-color:var(--accent)}
  .thumb .x{position:absolute;top:2px;right:2px;background:#000a;border:none;
    color:#fff;border-radius:5px;padding:0 5px;font-size:12px;line-height:18px}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
  label.f input,label.f select{font:inherit;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:90px}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .grid{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:3px 9px;border-radius:16px;border:1px solid var(--line);
    color:var(--dim);font:12px var(--mono);transition:.12s}
  .chip.found{background:var(--ok-bg);border-color:var(--ok);color:#7ee2a0;font-weight:600}
  .summary{margin:12px 0;font:13px var(--mono)}
  .summary b{color:var(--ink)}
  table{width:100%;border-collapse:collapse;font:12px var(--mono);margin-top:8px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  td.found{color:#7ee2a0}
  tr.best td{background:var(--ok-bg)}
  .tag{padding:1px 6px;border-radius:5px;font-size:11px;border:1px solid var(--line)}
  .tag.gemini{color:var(--accent);border-color:var(--accent)}
  .tag.qwen{color:var(--warn);border-color:var(--warn)}
  .tag.none{color:var(--err);border-color:var(--err)}
  details{margin-top:10px}summary{cursor:pointer;color:var(--dim)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;
    padding:10px;overflow:auto;font:11px var(--mono);max-height:280px}
  .muted{color:var(--dim)}
  .hint{color:var(--dim);font-size:12px;margin-top:6px}
  #status{min-height:18px;color:var(--warn);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>object_scan</h1>
  <span class="sub">batched labels-only VLM scan · Gemini→Qwen</span>
  <span class="keys" id="keys"></span>
</header>

<main>
  <!-- ================= LEFT: shoot photos ================= -->
  <section class="card">
    <h2>Shoot photos</h2>
    <div class="row">
      <button id="camStart">Start camera</button>
      <button id="shoot" class="primary" disabled>Shoot photo</button>
      <button id="camStop" disabled>Stop</button>
    </div>
    <div class="row" style="margin-top:8px">
      <select id="camSel" style="flex:1;min-width:0"><option value="">default camera</option></select>
      <button id="camRefresh" title="re-scan cameras">⟳</button>
    </div>
    <div class="hint">Pick a camera and it switches live. Labels appear after you
      Start once (the browser reveals them only after camera permission).</div>
    <video id="cam" autoplay playsinline muted style="margin-top:10px;display:none"></video>
    <div id="dz">Drag &amp; drop photos here, or
      <label style="color:var(--accent);cursor:pointer">browse<input id="file" type="file"
        accept="image/*" multiple hidden></label></div>
    <div id="status"></div>
    <div class="gallery" id="gallery"></div>
  </section>

  <!-- ================= RIGHT: run tests ================= -->
  <section class="card">
    <h2>Run tests</h2>
    <img id="preview" alt="select a photo" style="max-height:280px;object-fit:contain">
    <div class="hint" id="selName">no photo selected</div>

    <div class="controls" style="margin-top:14px">
      <label class="f">batch_size<input id="batch" type="number" min="1" max="32" value="8"></label>
      <label class="f">max_workers<input id="workers" type="number" min="1" max="16" value="4"></label>
      <label class="f">qwen fallback
        <select id="qwen"><option value="1">on</option><option value="0">off</option></select></label>
      <button id="run" class="primary">Run test</button>
    </div>
    <div class="controls">
      <label class="f" style="flex:1">sweep batch sizes
        <input id="sweep" value="4,6,8,12,16" style="width:100%"></label>
      <button id="runSweep">Run sweep</button>
    </div>

    <div id="results" style="display:none">
      <div class="summary" id="summary"></div>
      <div class="grid" id="vocab"></div>
      <div id="batchBox"></div>
      <div id="sweepBox"></div>
    </div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let VOCAB=[], SELECTED=null, stream=null;

async function jget(u){const r=await fetch(u);return r.json();}
async function jsend(u,m,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b||{})});return r.json();}
function setStatus(t,cls){const s=$('#status');s.textContent=t||'';s.style.color=
  cls==='err'?'var(--err)':cls==='ok'?'var(--ok)':'var(--warn)';}

// ---- init ----
(async()=>{
  const k=await jget('/api/vocabulary').catch(()=>({}));
  VOCAB=k.vocabulary||[];
  renderVocabGrid(null);
  const g=$('#vocab'); // status pills
  const kd=$('#keys');
  const meta=await fetch('/api/photos').then(r=>r.ok);
  kd.innerHTML=`<span class="pill ${meta?'on':'off'}">server</span>
    <span class="pill">${VOCAB.length} classes</span>`;
  loadGallery();
})();

// ---- camera ----
async function listCameras(){
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cams=devs.filter(d=>d.kind==='videoinput');
    const sel=$('#camSel'),cur=sel.value;
    sel.innerHTML='<option value="">default camera</option>'+cams.map((d,i)=>
      `<option value="${d.deviceId}">${d.label||('Camera '+(i+1))}</option>`).join('');
    if(cur&&cams.some(d=>d.deviceId===cur))sel.value=cur;
    return cams;
  }catch(e){return [];}
}
async function startCamera(deviceId){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  const vc=deviceId?{deviceId:{exact:deviceId}}:{};
  try{
    stream=await navigator.mediaDevices.getUserMedia(
      {video:{...vc,width:{ideal:1280},height:{ideal:720}}});
  }catch(e){                     // exact device busy/unavailable -> any camera
    stream=await navigator.mediaDevices.getUserMedia({video:true});
  }
  const v=$('#cam');v.srcObject=stream;v.style.display='block';
  $('#shoot').disabled=false;$('#camStop').disabled=false;$('#camStart').disabled=true;
  await listCameras();           // labels are populated now that permission is granted
  const track=stream.getVideoTracks()[0];
  const sid=track.getSettings&&track.getSettings().deviceId;
  if(sid)$('#camSel').value=sid;
  setStatus('camera: '+(track.label||'active'),'ok');
}
$('#camStart').onclick=async()=>{
  try{await startCamera($('#camSel').value||undefined);}
  catch(e){setStatus('camera unavailable: '+e.message+' — use upload instead','err');}
};
$('#camSel').onchange=async()=>{
  if(!stream)return;             // just remember the pick until Start is pressed
  try{await startCamera($('#camSel').value||undefined);}
  catch(e){setStatus('switch failed: '+e.message,'err');}
};
$('#camRefresh').onclick=()=>listCameras();
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)
  navigator.mediaDevices.addEventListener('devicechange',listCameras);
listCameras();                   // initial (generic) list; real labels after Start
$('#camStop').onclick=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $('#cam').style.display='none';$('#shoot').disabled=true;$('#camStop').disabled=true;$('#camStart').disabled=false;};
$('#shoot').onclick=async()=>{
  const v=$('#cam');const c=document.createElement('canvas');
  c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  const url=c.toDataURL('image/jpeg',0.92);
  const res=await jsend('/api/photos','POST',{image:url,source:'cam'});
  if(res.name){await loadGallery();selectPhoto(res.name);setStatus('captured '+res.name,'ok');}
};

// ---- upload / drag-drop ----
$('#file').onchange=e=>uploadFiles(e.target.files);
const dz=$('#dz');
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('hot');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('hot');}));
dz.addEventListener('drop',e=>uploadFiles(e.dataTransfer.files));
async function uploadFiles(files){
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    const url=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});
    const out=await jsend('/api/photos','POST',{image:url,source:'up'});
    if(out.name){await loadGallery();selectPhoto(out.name);}
  }
  setStatus('uploaded','ok');
}

// ---- gallery ----
async function loadGallery(){
  const {photos=[]}=await jget('/api/photos');
  const g=$('#gallery');g.innerHTML='';
  photos.forEach(n=>{
    const d=document.createElement('div');d.className='thumb'+(n===SELECTED?' sel':'');
    d.innerHTML=`<img src="/photos/${n}" title="${n}"><button class="x" title="delete">✕</button>`;
    d.querySelector('img').onclick=()=>selectPhoto(n);
    d.querySelector('.x').onclick=async ev=>{ev.stopPropagation();
      await fetch('/api/photos/'+n,{method:'DELETE'});
      if(SELECTED===n){SELECTED=null;$('#preview').removeAttribute('src');$('#selName').textContent='no photo selected';}
      loadGallery();};
    g.appendChild(d);
  });
}
function selectPhoto(n){SELECTED=n;$('#preview').src='/photos/'+n;$('#selName').textContent=n;
  $$('.thumb').forEach(t=>t.classList.toggle('sel',t.querySelector('img').src.endsWith(n)));}

// ---- vocab grid ----
function renderVocabGrid(found){
  const set=new Set(found||[]);
  $('#vocab').innerHTML=VOCAB.map(v=>
    `<span class="chip${set.has(v)?' found':''}">${v}</span>`).join('');
}

// ---- run test ----
$('#run').onclick=async()=>{
  if(!SELECTED)return setStatus('select or shoot a photo first','err');
  const btn=$('#run');btn.disabled=true;btn.textContent='running…';setStatus('calling VLM…');
  try{
    const body={photo:SELECTED,batch_size:+$('#batch').value,max_workers:+$('#workers').value,
      use_qwen_fallback:$('#qwen').value==='1'};
    const res=await jsend('/api/scan','POST',body);
    if(res.error)throw new Error(res.error);
    renderResult(res.result);setStatus('done','ok');
  }catch(e){setStatus('scan failed: '+e.message,'err');}
  finally{btn.disabled=false;btn.textContent='Run test';}
};
function renderResult(r){
  $('#results').style.display='';$('#sweepBox').innerHTML='';
  renderVocabGrid(r.found_labels);
  $('#summary').innerHTML=`found <b>${r.n_found}/${r.n_vocab}</b> ·
    <b>${r.total_latency_s}s</b> · batch_size <b>${r.batch_size}</b> ·
    batches ok <b>${r.batches_ok}</b> / fail <b>${r.batches_fail}</b>`;
  let h=`<table><tr><th>#</th><th>batch items</th><th>found</th><th>via</th><th>lat</th></tr>`;
  r.batches.forEach((b,i)=>{
    const via=b.provider?`<span class="tag ${b.provider}">${b.provider}</span>`:`<span class="tag none">fail</span>`;
    h+=`<tr><td>${i}</td><td class="muted">${b.items.join(', ')}</td>
      <td class="found">${b.found.join(', ')||'—'}</td><td>${via}</td>
      <td>${b.latency_s??'—'}</td></tr>`;
    if(b.error)h+=`<tr><td></td><td colspan="4" style="color:var(--err)">${b.error}</td></tr>`;
  });
  h+=`</table><details><summary>raw responses</summary><pre>${
    JSON.stringify(r.batches.map(b=>({provider:b.provider,raw:b.raw,error:b.error})),null,2)
    .replace(/</g,'&lt;')}</pre></details>`;
  $('#batchBox').innerHTML=h;
}

// ---- sweep ----
$('#runSweep').onclick=async()=>{
  if(!SELECTED)return setStatus('select or shoot a photo first','err');
  const sizes=$('#sweep').value.split(',').map(x=>parseInt(x.trim())).filter(Boolean);
  if(!sizes.length)return setStatus('enter batch sizes e.g. 4,8,16','err');
  const btn=$('#runSweep');btn.disabled=true;btn.textContent='sweeping…';
  setStatus(`sweeping ${sizes.length} batch sizes… (this runs the scan ${sizes.length}×)`);
  try{
    const res=await jsend('/api/sweep','POST',{photo:SELECTED,batch_sizes:sizes,
      max_workers:+$('#workers').value,use_qwen_fallback:$('#qwen').value==='1'});
    if(res.error)throw new Error(res.error);
    renderSweep(res.sweep);setStatus('sweep done','ok');
  }catch(e){setStatus('sweep failed: '+e.message,'err');}
  finally{btn.disabled=false;btn.textContent='Run sweep';}
};
function renderSweep(rows){
  $('#results').style.display='';
  const best=Math.max(...rows.map(r=>r.n_found));
  let h=`<h2 style="margin-top:16px">Batch-size sweep</h2>
    <table><tr><th>batch_size</th><th>found</th><th>latency</th><th>labels</th></tr>`;
  rows.forEach(r=>{
    h+=`<tr class="${r.n_found===best?'best':''}"><td>${r.batch_size}</td>
      <td class="found">${r.n_found}/${r.n_vocab}</td><td>${r.total_latency_s}s</td>
      <td class="muted">${r.found_labels.join(', ')||'—'}</td></tr>`;
  });
  h+=`</table><div class="hint">Highlighted row = most objects found.
    Best batch_size balances recall (found) against latency.</div>`;
  $('#sweepBox').innerHTML=h;
  // show union of the best row on the grid
  const b=rows.find(r=>r.n_found===best);renderVocabGrid(b?b.found_labels:[]);
  $('#batchBox').innerHTML='';
  $('#summary').innerHTML=`sweep of <b>${rows.length}</b> batch sizes · grid shows best (bs=<b>${b?b.batch_size:'?'}</b>)`;
}
</script>
</body>
</html>
