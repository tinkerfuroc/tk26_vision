foundation_stereo:
  ros__parameters:
    # Paths & model defaults
    weights_root: "~/.cache/tk26_vision/weights/foundation_stereo"
    camera_profile: "d435"
    # The node only serves `fast_trt`. default_model_kind is kept for
    # backwards-compat but ignored; non-fast_trt requests are rejected.
    default_model_kind: "fast_trt"
    default_trt_variant: "output_two_stage"
    default_scale: 1.0
    default_iters: 0
    default_z_far: 10.0
    # Pre-load + run one live forward through the default TRT variant
    # at node startup so the first request lands at warm latency.
    warmup_on_launch: true

    # Topic overrides — leave blank to use the profile's defaults.
    left_topic: ""
    right_topic: ""
    left_info_topic: ""
    color_info_topic: ""
    extrinsics_topic: ""
    baseline_m: 0.0

    # Sync + measurement
    sync_slop_sec: 0.05
    sync_queue_size: 5
    measure_forward_ms: true

    # Streaming
    stream_enabled: false
    stream_align_to_color: false
    stream_depth_topic: ""
    stream_info_topic: ""
    stream_dtype: "16UC1_mm"
    output_frame_id: ""
    stream_publish_vis: false
    stream_max_fps: 15.0
    # Now that the cold TRT warmup runs off the synchronous init path
    # (background daemon thread + model-ready gate), the executor is live
    # immediately and the latched extrinsics/color_info arrive within ms,
    # so this gate passes far inside its window. Kept at 15 s as margin.
    extrinsics_warmup_timeout_sec: 15.0
    stream_measure_forward_ms: false
    # 'reliable' (default) = drop-in for realsense aligned_depth_to_color,
    # visible in default-QoS RViz; 'best_effort' = lower-overhead sensor stream.
    stream_qos_reliability: "reliable"

    # Logging
    vision_logging_enabled: false
    vision_log_folder: "vision_log"
