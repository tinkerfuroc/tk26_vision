/**:
  ros__parameters:
    # Model
    model_path: 'yolo11m-seg.pt'  # m-seg: better masks, 5.5ms @736 fp16 (~182fps); s-seg for weak/offline GPUs, or a .engine for TRT
    confidence_threshold: 0.5     # detection conf for non-tracking detect() calls / downstream gates
    yolo_track_conf: 0.15         # LOW conf into model.track so ByteTrack low-conf recovery runs
    enable_reid: true
    inference_size: 736           # imgsz for YOLO (Phase-0 throughput quick-win; was 1280)
    reid_verification_interval: 5

    # ReID backbone (Phase 1)
    reid_backbone: 'osnet_ain_x1_0'   # alt: 'osnet_x0_25'
    reid_mode: 'custom'               # 'custom' or 'native' (native loud-guarded in Phase 0)
    reid_fp16: true                   # half-precision ReID forward (CUDA only; no-op on CPU)
    reid_gallery_enabled: true        # multi-view reacquisition gallery (kill-switch)
    reid_gallery_size: 6              # K diverse views kept
    reid_gallery_novelty_max: 0.85    # admit a view only if < this cosine to existing
    reid_gallery_score_mode: 'max'    # 'max' | 'top2_mean' (precision fallback)
    gallery_min_mask_fill: 0.35       # gallery gate #1: min mask-fill (mask_px/bbox_area, strict <=); low fill = merged/occluded box, reject
    gallery_max_aspect_ratio: 0.5     # gallery gate #2: max bbox w/h to admit; operator always upright (~0.4), reject square/wide. Both gates AND'd; adjustable at launch

    # Loss / recovery
    max_frames_lost: 600
    lost_timeout: 300.0

    # --- Phase 2: recovery policy (asymmetric hysteresis) ---
    max_recovery_frames: 45          # coast cap; past this → hard-lost
    active_help_after_sec: 5.0       # WALL-CLOCK seconds lost (since the last confirmed lock) before TrackPerson feedback reacquisition_state escalates to NEEDS_HELP (active call-out). Wall-clock, not frame-count: tournament GPU contention makes the frame rate unreliable.
    active_help_timeout_sec: 0.0     # while reacquisition_state==NEEDS_HELP, keep the tracker+gallery alive (no abort/reset) for reseed/wave-to-resume. 0 = hold INDEFINITELY (only a reseed or cancel ends it); a positive value bounds the hold to that many seconds. Disable active help entirely with active_help_after_sec<=0.
    # --- Frame-starvation watchdog (RGB+depth synchronizer stall) ---
    frame_stall_warn_sec: 0.5        # no new synchronized frame for this long -> warn + keep dashboard alive (stall banner + last frame). Must exceed the camera inter-frame gap (~33 ms @ 30 Hz).
    frame_stall_lost_sec: 1.5        # no new synchronized frame for this long -> engage the loss/recovery FSM (forever-hold + wave/reseed) so a camera stall recovers like a person-lost.
    # --- track_web dashboard telemetry (all default OFF; zero production impact) ---
    debug_state_enabled: false       # ~/debug_state JSON per frame
    gallery_keep_crops: false        # retain + publish gallery view thumbnails (~/debug_gallery)
    debug_image_enabled: false       # ~/debug_image annotated frames (only drawn when subscribed)
    reacq_debug_logging: false       # ~3 Hz reacq similarity-vs-bar diagnostic while lost (console)
    provisional_high_bar: 0.72       # single-candidate fast-publish floor (reid_search.py)
    provisional_distinct_margin: 0.10  # min best-vs-second margin to publish in a crowd
    crosser_depth_jump_m: 0.6        # reject candidates this much nearer than the operator

    # --- Phase 2: geometry robustness ---
    centroid_ema_alpha: 0.5          # 1.0 = no smoothing; lower = smoother
    torso_band_enabled: true
    torso_band_lo: 0.15              # chest band top, frac of bbox height
    torso_band_hi: 0.55             # chest band bottom, frac of bbox height

    # Camera topics
    image_topic: '/camera/color/image_raw'
    depth_topic: '/camera/depth/image_raw'
    camera_info_topic: '/camera/color/camera_info'

    # Loop / output
    tracking_rate: 15.0
    target_point_topic: '/target_points'

    # Logging
    vision_logging_enabled: true
    vision_log_folder: 'vision_log'
    perf_logging_enabled: false       # introduced in Phase 0

    # --- Pan-tilt head follow (default OFF; needs pan_tilt controller running) ---
    # Keeps the locked person horizontally centered via the head pan servo (ABSOLUTE
    # mode, tilt held at fixed_tilt_deg). Runs in the ~30 Hz tracking loop.
    enable_pan_tilt_follow: true
    pan_tilt_command_topic: /pan_tilt_controller/cmd
    pan_tilt_state_topic: /pan_tilt_controller/state
    fixed_tilt_deg: 37.0
    pan_sign: 1.0                      # flip to -1.0 if the head turns away from the person
    pan_deadband_deg: 3.0
    pan_min_command_change_deg: 1.0
    pan_min_command_interval_sec: 0.15
    pan_ema_alpha: 0.5
    pan_min_deg: -90.0
    pan_max_deg: 90.0
    pan_command_speed_raw: 0          # 0 -> controller default
    pan_command_accel_raw: 0
