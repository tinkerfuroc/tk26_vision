<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>track_web — Tinker person tracker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>track_web</h1>
  <span id="conn" class="badge off">connecting…</span>
  <span id="mode" class="badge off">—</span>
</header>
<main>
  <section id="video-pane">
    <div id="video-wrap">
      <img id="video" src="/stream.mjpg" alt="annotated tracker view">
      <div id="overlays"></div>
      <div id="stale-banner" class="hidden">NO DATA — tracker silent</div>
    </div>
    <div id="controls">
      <button id="btn-start">▶ Start goal</button>
      <button id="btn-stop">■ Stop</button>
      <button id="btn-wave">👋 DetectWaving</button>
      <button id="btn-record">⏺ Record bag</button>
      <button id="btn-clear">✕ Clear overlays</button>
    </div>
  </section>
  <aside id="rail">
    <div class="panel" id="bringup">
      <h2>Follow Demo</h2>
      <div class="demo-master">
        <button id="demo-start" class="demo-btn primary">▶ Start Demo</button>
        <button id="demo-stop" class="demo-btn">■ Stop All</button>
      </div>
      <div class="proc-row" data-proc="audio">
        <span class="proc-num">1</span>
        <span class="proc-name">Audio</span>
        <span class="proc-pill off" id="pill-audio">stopped</span>
        <button class="proc-btn" id="proc-audio">Start</button>
      </div>
      <div class="proc-row" data-proc="dummy_nav">
        <span class="proc-num">2</span>
        <span class="proc-name">Dummy Nav</span>
        <span class="proc-pill off" id="pill-dummy_nav">stopped</span>
        <button class="proc-btn" id="proc-dummy_nav">Start</button>
      </div>
      <div class="proc-row" data-proc="bt">
        <span class="proc-num">3</span>
        <span class="proc-name">Follow BT</span>
        <span class="proc-pill off" id="pill-bt">stopped</span>
        <button class="proc-btn" id="proc-bt">Start</button>
      </div>
      <p id="bringup-hint" class="hint hidden">ⓘ Follow BT owns the tracking goal — manual Start disabled while it runs.</p>
    </div>
    <div class="panel">
      <div id="reacq-badge" class="reacq">—</div>
      <table id="state-table">
        <tr><td>FSM</td><td id="fsm">—</td></tr>
        <tr><td>target_lost</td><td id="lost">—</td></tr>
        <tr><td>track id</td><td id="ids">—</td></tr>
        <tr><td>frames_lost</td><td id="frames">—</td></tr>
        <tr><td>hold left</td><td id="hold">—</td></tr>
        <tr><td>best / 2nd sim</td><td id="sims">—</td></tr>
      </table>
    </div>
    <div class="panel">
      <h2>Gallery <span id="gal-meta"></span></h2>
      <div id="gallery"></div>
    </div>
    <div class="panel">
      <h2>Events</h2>
      <ul id="log"></ul>
    </div>
  </aside>
</main>
<script src="/app.js"></script>
</body>
</html>
